name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      tests:
        description: Also run all tests (no installers)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"

jobs:
  scope:
    name: Determine changed scopes
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      rust: ${{ steps.scope.outputs.rust }}
      tooling: ${{ steps.scope.outputs.tooling }}
      workflow: ${{ steps.scope.outputs.workflow }}
      contract: ${{ steps.scope.outputs.contract }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - id: scope
        run: node scripts/check-changes.mjs scope

  frontend:
    name: Frontend lint and types
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-changes.mjs frontend

  tooling:
    name: Tooling lint and selected tests
    needs: scope
    if: needs.scope.outputs.tooling == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-changes.mjs tooling

  rust:
    name: Rust (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: checks-${{ matrix.os }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Rust checks and selected tests; verify exports when contracts change
        run: node scripts/check-changes.mjs rust

  workflow:
    name: Workflow syntax
    needs: scope
    if: needs.scope.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Validate workflows with pinned actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=

  result:
    name: Checks result
    if: always()
    needs: [scope, frontend, tooling, rust, workflow]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const jobs = JSON.parse(process.env.JOB_RESULTS);
            const failed = Object.values(jobs).some(job => ["failure", "cancelled"].includes(job.result));
            const scoped = jobs.scope.result === "success";
            const incomplete = scoped && ["frontend", "tooling", "rust", "workflow"].some(
              name => jobs.scope.outputs[name] === "true" && jobs[name].result !== "success"
            );
            if (failed || !scoped || incomplete) process.exit(1);
            console.log("All applicable checks passed; unrelated checks were skipped.");
          '
